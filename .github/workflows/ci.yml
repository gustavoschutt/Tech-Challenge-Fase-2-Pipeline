name: CI/CD Pipeline - Test & Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Test & Quality Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab imageio-ffmpeg moviepy pytest-cov

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile orchestrator.py
          python -m py_compile pipeline/bronze/ingest_batch.py
          python -m py_compile pipeline/silver/transform.py
          python -m py_compile pipeline/gold/build_analytics.py
          python -m py_compile scripts/data_quality.py
          python -m py_compile monitoring/monitoring.py
          python -m py_compile streaming/streaming_pipeline.py

      - name: Run Test Suite (pytest)
        run: |
          pytest tests/ -v --cov=pipeline --cov=scripts --cov=monitoring

      - name: Test Orchestrator CLI
        run: |
          python orchestrator.py --help

  terraform-lint:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=infra/terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
